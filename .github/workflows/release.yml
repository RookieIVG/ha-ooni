name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          # Tag-Namen holen und ein evtl. führendes "v" entfernen (1.0.2 oder v1.0.2)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Setze Version auf $VERSION"
          cd custom_components/ooni_connect
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Create zip
        run: |
          cd custom_components/ooni_connect
          zip -r ooni_connect.zip .

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/ooni_connect/ooni_connect.zip
